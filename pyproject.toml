[project]
name = "sni-hostname-extractor-py"
version = "0.1.0"
description = "Extract SNI hostname from raw TLS ClientHello bytes using only the Python standard library."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
